# ===================== CONFIGURATION =====================
# Load version dynamically from the VERSION file to keep script and version in sync
SCRIPT_VERSION="$(cat $(dirname ${BASH_SOURCE[0]})/VERSION)"
SCRIPT_NAME="Proxmox Enhanced Security Tool"
CONFIG_DIR="/etc/proxmox-hardening"
REPORT_FILE="${CONFIG_DIR}/security_report_$(date +%Y%m%d_%H%M%S).txt"
REPORT_DIR="/usr/local/bin"
BACKUP_DIR="${CONFIG_DIR}/backup"
LOG_FILE="${CONFIG_DIR}/hardening.log"
PROGRESS_FILE="${CONFIG_DIR}/progress.state"
# ===================== Network configuration =====================
IPV4=$(timeout 5 ip route get 8.8.8.8 2>/dev/null | head -1 | awk '{print $7}')
IPV4=${IPV4:-'your.server.ip'}
PUBLIC_IP=$(timeout 5 curl -s --max-time 5 ifconfig.me 2>/dev/null)
PUBLIC_IP=${PUBLIC_IP:-'your.public.ip'}


